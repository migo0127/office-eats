name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # 請確認你的 GitHub 分支真的是 master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production --base-href /office-eats/

      - name: Fix 404 for Angular Routing
        run: cp dist/office-eats/browser/index.html dist/office-eats/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/office-eats/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4